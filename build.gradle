plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf' version '0.10.1'
    id 'jacoco'
}

group = 'cl.ucn.disc.arqsist'
version = '2.0.4'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:7.2.3'
    implementation 'com.j256.ormlite:ormlite-core:6.1'
    implementation 'com.j256.ormlite:ormlite-jdbc:6.1'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.2'
    implementation 'ch.qos.logback:logback-classic:1.6.3'
    implementation 'io.grpc:grpc-protobuf:1.85.1'
    implementation 'io.grpc:grpc-stub:1.85.1'
    implementation 'io.grpc:grpc-netty-shaded:1.85.1'

    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.grpc:grpc-inprocess:1.85.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.9'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.85.1'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

application {
    mainClass = 'cl.ucn.disc.arqsist.library.App'
}

tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Run the member gRPC client.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cl.ucn.disc.arqsist.library.MemberClientApp'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'CLASS'
            includes = [
                    'cl.ucn.disc.arqsist.library.dao.BaseDao',
                    'cl.ucn.disc.arqsist.library.dao.OrmLiteBookDao',
                    'cl.ucn.disc.arqsist.library.dao.OrmLiteMemberDao',
                    'cl.ucn.disc.arqsist.library.dao.OrmLiteLoanDao',
                    'cl.ucn.disc.arqsist.library.dao.OrmLiteReservationDao'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
