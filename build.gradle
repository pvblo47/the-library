plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

group = 'cl.ucn.disc.arqsist'
version = '2.0.1'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:7.2.3'
    implementation 'com.j256.ormlite:ormlite-core:6.1'
    implementation 'com.j256.ormlite:ormlite-jdbc:6.1'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    implementation 'ch.qos.logback:logback-classic:1.6.3'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'cl.ucn.disc.arqsist.library.App'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'CLASS'
            includes = [
                    'cl.ucn.disc.arqsist.library.dao.BaseDao',
                    'cl.ucn.disc.arqsist.library.dao.OrmLiteBookDao',
                    'cl.ucn.disc.arqsist.library.dao.OrmLiteMemberDao',
                    'cl.ucn.disc.arqsist.library.dao.OrmLiteLoanDao',
                    'cl.ucn.disc.arqsist.library.dao.OrmLiteReservationDao'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
