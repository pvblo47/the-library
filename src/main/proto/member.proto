syntax = "proto3";
package library.member.v1;
option java_package = "cl.ucn.disc.arqsist.library.grpc";
option java_multiple_files = true;
service MemberService {
  rpc RegisterMember (RegisterMemberRequest) returns (MemberMessage);
  rpc ListMembers (ListMembersRequest) returns (ListMembersReply);
  rpc GetMember (GetMemberRequest) returns (MemberMessage);
}
message MemberMessage {
  int32 id = 1;
  string name = 2;
  string email = 3;
}
message RegisterMemberRequest {
  string name = 1;
  string email = 2;
}
message ListMembersRequest {}
message ListMembersReply {
  repeated MemberMessage members = 1;
}
message GetMemberRequest {
  int32 id = 1;
}
